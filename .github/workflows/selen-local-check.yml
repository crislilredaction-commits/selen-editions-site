name: Selen local check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche ou commit à tester"
        required: true
        default: "fix/daily-manual-enrolment-party-session-20260927"
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: [self-hosted, Linux, X64, selen-local]
    timeout-minutes: 30

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          clean: true

      - name: Environment
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build
