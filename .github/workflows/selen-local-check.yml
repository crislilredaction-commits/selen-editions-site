# Branche de contrôle temporaire, jamais fusionnée dans Daily.
name: Selen local check
on:
  push:
    branches: ["fix/studio-lenovo-validation-20261003"]
permissions:
  contents: read
concurrency:
  group: selen-codex-runner
  cancel-in-progress: false
jobs:
  prepare-migration:
    name: Supabase migration filename
    runs-on: [self-hosted, Linux, X64, selen-local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: crislilredaction-commits/selen-studio
          ref: "64edc5a845c0dca9a59ef957b5717f5f87306368"
          clean: true
          persist-credentials: false
      - name: Generate migration with official Supabase CLI
        run: |
          npx --yes supabase@2.119.0 --version
          npx --yes supabase@2.119.0 migration new --help
          npx --yes supabase@2.119.0 migration new daily_studio_questionnaire_resubmission
